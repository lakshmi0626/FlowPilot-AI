name: Bug Report
description: File a bug report to help improve FlowPilot AI
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please describe the bug clearly.
  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: Brief one-line explanation of the issue
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce this behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
    validations:
      required: true
